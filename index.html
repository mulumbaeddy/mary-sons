<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#01605a">
  <title>Polythene Business Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ===== Sign in ===== -->
  <div id="loginView" class="login-wrap">
    <section class="login-card">
      <div class="brand-mark">PB</div>
      <p class="eyebrow">BUSINESS MANAGEMENT</p>
      <h1>Polythene Bags Manager</h1>
      <p class="muted">Stock, purchases, sales, debts and profit in one place.</p>
      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="username" required placeholder="">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="Your password">
        <button class="primary full" type="submit">Sign in</button>
        <p id="loginMessage" class="message" role="status"></p>
        <button type="button" id="forgotBtn" class="link">Forgot password?</button>
      </form>
    </section>
  </div>

  <!-- ===== App ===== -->
  <div id="appView" class="shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand"><span class="brand-mark small">PB</span><div><strong>Polythene</strong><small>Business Manager</small></div></div>
      <nav id="mainNav" aria-label="Main"></nav>
      <div class="sidebar-bottom">
        <div class="user-chip"><span class="avatar" id="userInitial">U</span><div><strong id="userName">User</strong><small id="userRole"></small></div></div>
        <div class="side-buttons"><button id="changePwBtn" class="ghost">Password</button><button id="logoutBtn" class="ghost">Sign out</button></div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div class="title"><p class="eyebrow" id="pageEyebrow"></p><h1 id="pageTitle"></h1></div>
        <div class="top-actions"><span class="date-pill" id="todayLabel"></span><button class="primary" id="quickSaleBtn" hidden>+ New sale</button></div>
      </header>
      <section id="pageContent" aria-live="polite"></section>
      <footer>Polythene Business Manager <span>•</span> Currency: UGX</footer>
    </main>
  </div>

  <dialog id="modal"></dialog>
  <div id="printArea"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
